name: Release

# Push a tag like v0.1.0 and the Windows installer is built and attached to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # the engine folder that goes into the installer: Python, pip and the core packages
      - run: python scripts/build_engine.py

      - run: npm ci
        working-directory: frontend
      - run: npm run tauri build -- --bundles nsis
        working-directory: frontend

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: officev2-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
